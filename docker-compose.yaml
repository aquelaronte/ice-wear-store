version: "3"

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "6333:6333" # REST API & Web UI
      - "6334:6334" # gRPC API
    volumes:
      - qdrant_storage:/qdrant/storage:z
      - qdrant_snapshots:/qdrant/snapshots:z
    environment:
      - QDRANT__SERVICE__API_KEY=secret_api_key

  postgres:
    image: postgres:16-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ice_wear_store
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    shm_size: 128mb

volumes:
  postgres_data:
  qdrant_storage:
  qdrant_snapshots:
